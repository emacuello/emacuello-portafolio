allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
# @astrojs/astro2tsx ships @emnapi/core 1.11.3 but not the matching runtime peer;
# pnpm then picks @emnapi/runtime 2.0.0-alpha and `astro check` crashes.
packageExtensions:
  '@astrojs/astro2tsx@0.1':
    dependencies:
      '@emnapi/runtime': 1.11.3
